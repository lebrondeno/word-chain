<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545" />
      <stop offset="50%" stop-color="#13315c" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f9d55" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Deep Royal Navy Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <circle cx="1100" cy="80" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />
  <circle cx="100" cy="550" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Badge Top Header -->
  <rect x="80" y="60" width="360" height="42" rx="21" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
  <text x="100" y="87" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">⚡ REAL-TIME MULTIPLAYER &amp; QUIZ HUB</text>

  <!-- Main Headline -->
  <text x="80" y="155" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
    Play, Guess &amp; Know Your Friends.
  </text>
  <text x="80" y="205" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">
    3 addictive game modes — instant join in your browser with zero installs.
  </text>

  <!-- Card 1: Word Chain -->
  <g transform="translate(80, 260)" filter="url(#shadow)">
    <rect width="320" height="300" rx="24" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Artwork Top -->
    <rect x="0" y="0" width="320" height="130" rx="24" fill="#eff6ff" />
    <path d="M 0 106 Q 160 130 320 106 L 320 0 L 0 0 Z" fill="#dbeafe" />
    
    <!-- Letter tiles -->
    <rect x="35" y="32" width="60" height="60" rx="12" fill="#3b4cca" />
    <text x="65" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">W</text>
    
    <rect x="110" y="32" width="60" height="60" rx="12" fill="#1f9d55" />
    <text x="140" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">O</text>

    <!-- Stopwatch icon -->
    <circle cx="230" cy="62" r="26" fill="#f8fafc" stroke="#f59e0b" stroke-width="4" />
    <line x1="230" y1="62" x2="230" y2="48" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="230" y1="62" x2="242" y2="62" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <text x="230" y="105" fill="#d97706" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">30s TIMER</text>

    <!-- Text Body -->
    <text x="24" y="165" fill="#0b2545" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Word Chain</text>
    <text x="24" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Fast elimination. Link words</text>
    <text x="24" y="215" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="500">by their last letter before 30s!</text>

    <rect x="24" y="240" width="140" height="34" rx="17" fill="#1f9d55" />
    <text x="94" y="262" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Multiplayer Room</text>
  </g>

  <!-- Card 2: Would You Rather -->
  <g transform="translate(440, 260)" filter="url(#shadow)">
    <rect width="320" height="300" rx="24" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Artwork Top -->
    <rect x="0" y="0" width="320" height="130" rx="24" fill="#fdf2f8" />
    
    <!-- Choice A tile -->
    <rect x="25" y="30" width="115" height="65" rx="14" fill="url(#blueGrad)" />
    <text x="82" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">OPTION A</text>
    <text x="82" y="80" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Fly anywhere</text>

    <!-- Choice B tile -->
    <rect x="180" y="30" width="115" height="65" rx="14" fill="url(#coralGrad)" />
    <text x="237" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800" text-anchor="middle">OPTION B</text>
    <text x="237" y="80" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Read minds</text>

    <!-- Lightning divider -->
    <circle cx="160" cy="62" r="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <polygon points="161,48 153,63 160,63 159,76 167,61 160,61" fill="#f59e0b" />

    <!-- Text Body -->
    <text x="24" y="165" fill="#0b2545" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Would You Rather</text>
    <text x="24" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Vote secretly on spicy dilemmas,</text>
    <text x="24" y="215" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="500">then reveal group splits!</text>

    <rect x="24" y="240" width="140" height="34" rx="17" fill="#3b4cca" />
    <text x="94" y="262" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Vote &amp; Reveal</text>
  </g>

  <!-- Card 3: Friendship Test -->
  <g transform="translate(800, 260)" filter="url(#shadow)">
    <rect width="320" height="300" rx="24" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Artwork Top -->
    <rect x="0" y="0" width="320" height="130" rx="24" fill="#f0fdf4" />

    <!-- Donut Score Chart -->
    <circle cx="90" cy="65" r="38" fill="#0b2545" />
    <circle cx="90" cy="65" r="32" fill="none" stroke="#3b4cca" stroke-width="8" stroke-dasharray="140 60" />
    <circle cx="90" cy="65" r="32" fill="none" stroke="#1f9d55" stroke-width="8" stroke-dasharray="80 120" stroke-dashoffset="-40" />
    <text x="90" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">9</text>
    <line x1="78" y1="65" x2="102" y2="65" stroke="#ffffff" stroke-width="1.5" />
    <text x="90" y="79" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">10</text>

    <!-- Golden Trophy & Emojis -->
    <circle cx="210" cy="65" r="34" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" />
    <text x="210" y="74" font-size="34" text-anchor="middle">🏆</text>
    <text x="255" y="55" font-size="20">😍</text>
    <text x="260" y="85" font-size="18">⭐</text>

    <!-- Text Body -->
    <text x="24" y="165" fill="#0b2545" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Friendship Test</text>
    <text x="24" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Know Me Better quiz. Create</text>
    <text x="24" y="215" fill="#475569" font-family="system-ui, sans-serif" font-size="14" font-weight="500">your test &amp; see who knows you best!</text>

    <rect x="24" y="240" width="150" height="34" rx="17" fill="#1f9d55" />
    <text x="99" y="262" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Create Quiz (10-20q)</text>
  </g>

  <!-- Bottom link footer -->
  <text x="80" y="595" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
    Share via WhatsApp, Telegram, or any browser link. Anti-cheat server score protection.
  </text>
</svg>
