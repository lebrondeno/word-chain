<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545" />
      <stop offset="100%" stop-color="#13315c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f9d55" />
      <stop offset="100%" stop-color="#0b6e27" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#navGrad)" stroke="#3b4cca" stroke-width="3" />

  <!-- Two-tone decorative score ring -->
  <circle cx="60" cy="52" r="32" fill="none" stroke="#3b4cca" stroke-width="8" stroke-dasharray="100 100" stroke-dashoffset="25" />
  <circle cx="60" cy="52" r="32" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="100 100" stroke-dashoffset="-75" />

  <!-- Golden Center Trophy -->
  <path d="M48 38 h24 v14 c0 6.6 -5.4 12 -12 12 s-12 -5.4 -12 -12 Z" fill="url(#goldGrad)" />
  <path d="M48 42 H42 c-3.3 0 -6 2.7 -6 6 s2.7 6 6 6 h6" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
  <path d="M72 42 h6 c3.3 0 6 2.7 6 6 s-2.7 6 -6 6 h-6" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
  <path d="M57 64 h6 v10 h-6 Z" fill="#f59e0b" />
  <path d="M50 74 h20 v4 h-20 Z" fill="#d97706" rx="2" />

  <!-- Chain Links at bottom -->
  <rect x="28" y="90" width="18" height="10" rx="5" fill="none" stroke="#ffffff" stroke-width="3" />
  <rect x="42" y="90" width="18" height="10" rx="5" fill="none" stroke="#1f9d55" stroke-width="3" />
  <rect x="56" y="90" width="18" height="10" rx="5" fill="none" stroke="#f59e0b" stroke-width="3" />
  <rect x="70" y="90" width="18" height="10" rx="5" fill="none" stroke="#3b4cca" stroke-width="3" />
</svg>
